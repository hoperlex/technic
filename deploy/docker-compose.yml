# Production Compose — изоляция как у zakupki/estimat/billhub.
# Запуск на VPS из /opt/portals/technic:
#   docker compose -f deploy/docker-compose.yml -p technic up -d
# Секреты: /etc/technic-portal/prod.env (root:docker, 0640), вне git и образа.
# Миграции: docker compose -p technic --profile tools run --rm migrate
# Seed admin:  docker compose -p technic --profile tools run --rm seed
name: technic

x-common-env: &common-env
  env_file:
    - ${ENV_FILE:-/etc/technic-portal/prod.env}
  environment:
    NODE_ENV: production
    # Число ХОПОВ, а не `true`: внешний infra-nginx перезаписывает X-Forwarded-For адресом клиента,
    # nginx контейнера веба передаёт его не дописывая себя, — до API доходит ровно один адрес.
    # С `true` Fastify доверял бы всей цепочке, и клиент подставлял бы себе любой req.ip, обходя
    # лимиты входа, регистрации и почтовых ручек.
    TRUST_PROXY: ${TRUST_PROXY:-1}
    # Пол версии клиента (ADR 0146, решение 7) здесь НАМЕРЕННО не объявлен, хотя умолчание у него
    # есть и равно `1`: его держит сам сервер (`MIN_CLIENT_CONTRACT` в `apps/api/src/config.ts`), а
    # значение приходит из `prod.env`. Строка `MIN_CLIENT_CONTRACT: ${MIN_CLIENT_CONTRACT:-1}` в
    # этом блоке сделала бы обратное тому, ради чего заводилась: `environment` перекрывает
    # `env_file`, и правка `prod.env` перестала бы что-либо значить — а перевод фазы это ровно она.
    #
    # Порядок фаз (нарушать нельзя):
    #   фаза A — пол `1`, никто не заблокирован: выкатывается сборка, которая заголовок шлёт;
    #   фаза B — `deploy-auto --client-floor=<число новой сборки>` ОТДЕЛЬНЫМ действием, после
    #            того как новая статика раздаётся. Команда сама правит prod.env (атомарно, с
    #            сохранением root:docker 0640), пересоздаёт technic-api и проверяет исход; поднять
    #            пол выше контракта раздаваемой сборки она откажется — так портал закрылся бы для
    #            всех. Текущее состояние — `deploy-auto --client-floor` без значения.
    # Одним шагом это сделать нельзя: `api` и `web` поднимаются одной командой, а `web` зависит от
    # `api` (`depends_on` ниже), — старый клиент оказался бы заблокирован раньше, чем появилась
    # новая статика.

services:
  # Имена сервисов = DNS-алиасы. Короткие `api`/`web` на edge конфликтуют с zakupki.
  technic-api:
    <<: *common-env
    image: technic-api:${TAG:-latest}
    container_name: technic-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Только internal: снаружи API через technic-web (/api → technic-api).
    networks: [internal]

  technic-worker:
    <<: *common-env
    image: technic-worker:${TAG:-latest}
    container_name: technic-worker
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    restart: unless-stopped
    depends_on: [technic-api]
    networks: [internal]

  technic-web:
    image: technic-web:${TAG:-latest}
    container_name: technic-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      # Короткий commit SHA — вшивается в бандл и version.json (детект новой версии у клиента).
      args:
        BUILD_ID: ${BUILD_ID:-}
        # Токен DaData «Подсказки» (build-time). Пусто → веб без подсказок адресов (ADR 0006).
        VITE_DADATA_SUGGEST_TOKEN: ${VITE_DADATA_SUGGEST_TOKEN:-}
    depends_on: [technic-api]
    # Без host-ports: снаружи только infra-nginx через сеть edge
    restart: unless-stopped
    networks: [internal, edge]

  migrate:
    <<: *common-env
    image: technic-api:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    command: ['pnpm', '--filter', '@technic/api', 'db:migrate']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Preflight капчи (план `docs/smart-captcha-plan.md` §8, §13): гейт релиза. Шлёт в SmartCaptcha
  # заведомо мусорный токен и требует отказа. Смысл именно в отказе: в ограниченном режиме
  # (платёжный аккаунт не ACTIVE/TRIAL_ACTIVE) сервис отвечает `ok` на всё подряд — метрики
  # выглядят здоровыми, а капча не защищает, и релиз уехал бы с открытыми формами.
  #
  # Запускается deploy-auto ИЗ CANDIDATE-ОБРАЗА (`TAG=$COMMIT_SHA`) до переключения контейнеров:
  # без явного тега `run` взял бы `:latest`, а он до конца выката указывает на прошлый релиз, и
  # проверялся бы не тот код, который поедет в прод.
  #
  #   TAG=<sha> docker compose -p technic --profile tools run --rm captcha-check
  captcha-check:
    <<: *common-env
    image: technic-api:${TAG:-latest}
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    command: ['pnpm', '--filter', '@technic/api', 'check:captcha']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  seed:
    <<: *common-env
    image: technic-api:${TAG:-latest}
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    # ADMIN_EMAIL / ADMIN_PASSWORD передаются через -e при run
    command: ['pnpm', '--filter', '@technic/api', 'seed:admin']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Административная смена режима модуля истории назначения (план assignment-periods, П6).
  # Аварийный вход: заморозить запись, посмотреть режим и журнал переходов, когда портал недоступен
  # или уже заморожен, — HTTP-двери у этого пути нет и не будет (решение Р3).
  #
  # Ходит СВОИМ доступом: `DATABASE_MAINTENANCE_URL`, а при его отсутствии `DATABASE_MIGRATION_URL`.
  # Прикладной `DATABASE_URL` команда не берёт даже как запасной — иначе режим модуля менялся бы
  # кредами приложения, которому `UPDATE` на управляющие таблицы не выдаётся вовсе.
  #
  # Секрет maintenance-роли можно держать отдельным файлом: `MAINTENANCE_ENV_FILE=/etc/technic-portal/
  # maintenance.env` (root:docker 0640, как prod.env). По умолчанию — тот же prod.env: отдельный файл
  # это ужесточение, а не условие работы, и требовать его до заведения ролей значило бы сломать
  # аварийный вход ради ещё не существующей границы.
  #
  # `entrypoint` + `command`, а не один `command`: `docker compose run` заменяет команду целиком, и
  # аргументы иначе пришлось бы писать вместе с `pnpm`. Умолчание — `status`: одиночный `run` без
  # аргументов только читает.
  #
  #   docker compose -p technic --profile tools run --rm assignment-mode status
  #   docker compose -p technic --profile tools run --rm assignment-mode set \
  #     --write=all_frozen --actor=<email> --reason='<причина>' --build=<sha>
  assignment-mode:
    image: technic-api:${TAG:-latest}
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
      - ${MAINTENANCE_ENV_FILE:-${ENV_FILE:-/etc/technic-portal/prod.env}}
    environment:
      NODE_ENV: production
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    entrypoint: ['pnpm', '--filter', '@technic/api', 'assignment:mode']
    command: ['status']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Аттестация раската для переключения чтения (О4, Р3 плана assignment-periods). Её пишет job
  # ДЕПЛОЯ — сразу после успешного раската, — а потребляет переключение, у которого прав на запись
  # аттестации нет: разрешение и его обоснование обязаны исходить от разных рук. Доступ поэтому
  # свой (`DATABASE_DEPLOY_URL`); пока роли в кластере не разделены, команда берёт maintenance и
  # честно печатает, что разделения нет.
  #
  # Инвентарь раската приносится аргументом: базе он неоткуда узнать, какие образы работают. Во
  # время раската сборок законно две — называют обе.
  #
  #   docker compose -p technic --profile tools run --rm assignment-attest --build=<sha>
  assignment-attest:
    image: technic-api:${TAG:-latest}
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
      - ${MAINTENANCE_ENV_FILE:-${ENV_FILE:-/etc/technic-portal/prod.env}}
    environment:
      NODE_ENV: production
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    entrypoint: ['pnpm', '--filter', '@technic/api', 'assignment:attest']
    command: ['--help']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Теневое сравнение планов бумаги (этап 4 плана assignment-periods): поколение целей, прогон и
  # исход. Тот же доступ, что у `assignment-mode`, — своими кредами. Отличие одно и оно по делу:
  # команда зовёт БОЕВОЙ недельный расчёт бумаги, а тот тянет прикладной конфиг, поэтому прикладной
  # env ей нужен целиком (`prod.env` здесь и подключён). В базу она при этом всё равно ходит
  # `DATABASE_MAINTENANCE_URL`: сравнение — путь maintenance (З3), и прикладной роли его не открыть.
  #
  # Прогон идёт под `write_mode = all_frozen` (§10 плана): иначе legacy-транзакция, начатая до
  # сверки, закоммитит старый план уже после того, как поколение увидело ноль расхождений.
  #
  #   docker compose -p technic --profile tools run --rm assignment-shadow start --build=<sha>
  #   docker compose -p technic --profile tools run --rm assignment-shadow run --run=<uuid>
  #   docker compose -p technic --profile tools run --rm assignment-shadow finalize --run=<uuid>
  assignment-shadow:
    image: technic-api:${TAG:-latest}
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
      - ${MAINTENANCE_ENV_FILE:-${ENV_FILE:-/etc/technic-portal/prod.env}}
    environment:
      NODE_ENV: production
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    entrypoint: ['pnpm', '--filter', '@technic/api', 'assignment:shadow']
    command: ['status']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Массовый бэкфилл истории назначения (этап 4 плана assignment-periods): достраивает историю всем
  # заявкам, до которых не дошли двери, и печатает блокирующий отчёт. Прикладного env не требует
  # вовсе — в базу ходит только `DATABASE_MAINTENANCE_URL` (З3, П7), — но подключён он так же, как
  # у соседей: одна площадка, один файл секретов.
  #
  # По умолчанию команда — dry-run: ничего не пишет, считает и показывает отчёт. Запись включается
  # флагом `--apply`. Прогон ОДНОПОТОЧНЫЙ (спайк §4.3), поэтому второй такой контейнер параллельно
  # запускать нельзя. Файл `--state` кладётся на том, иначе прерванный прогон продолжить нечем.
  #
  #   docker compose -p technic --profile tools run --rm assignment-backfill \
  #     --report=/var/lib/technic/assignment/report.txt
  #   docker compose -p technic --profile tools run --rm assignment-backfill --apply \
  #     --state=/var/lib/technic/assignment/backfill.json
  assignment-backfill:
    image: technic-api:${TAG:-latest}
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
      - ${MAINTENANCE_ENV_FILE:-${ENV_FILE:-/etc/technic-portal/prod.env}}
    environment:
      NODE_ENV: production
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
      - ${ASSIGNMENT_WORK_DIR:-/var/lib/technic/assignment}:/var/lib/technic/assignment
    entrypoint: ['pnpm', '--filter', '@technic/api', 'assignment:backfill']
    command: []
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Обратный прогон истории назначения (этап 4 плана assignment-periods, волна 4.2): удаляет
  # восстановленную историю и возвращает заявки в состояние `empty`. Путь назад, а не forward-fix.
  #
  # РАБОТАЕТ ТОЛЬКО ПОД ЗАМОРОЗКОЙ (Е4): при `write_mode = normal` отказывается идти вовсе, потому
  # что под живой записью отчёт устаревает раньше, чем допечатается. Порядок на площадке —
  # `assignment-mode set --write=history_frozen …`, и только потом этот контейнер.
  #
  # Удаляет он НЕ «всё, что записал бэкфилл», а только заявки без единого человеческого следа
  # (предикат Д3 считается на заявку целиком и проверяется дважды — при отборе и под блокировкой).
  # Остальные попадают в отчёт с указанием, чья отмена, какая операция и какая связь их удержали.
  # По умолчанию dry-run; удаление — флагом `--apply`. Прогон однопоточный, как и бэкфилл.
  #
  #   docker compose -p technic --profile tools run --rm assignment-rollback \
  #     --report=/var/lib/technic/assignment/rollback.txt
  #   docker compose -p technic --profile tools run --rm assignment-rollback --apply \
  #     --state=/var/lib/technic/assignment/rollback.json
  assignment-rollback:
    image: technic-api:${TAG:-latest}
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
      - ${MAINTENANCE_ENV_FILE:-${ENV_FILE:-/etc/technic-portal/prod.env}}
    environment:
      NODE_ENV: production
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
      - ${ASSIGNMENT_WORK_DIR:-/var/lib/technic/assignment}:/var/lib/technic/assignment
    entrypoint: ['pnpm', '--filter', '@technic/api', 'assignment:rollback']
    command: []
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # Сводка готовности модуля истории назначения (этап 4 плана assignment-periods, волна 4.2):
  # одним вызовом — сколько заявок в каком состоянии, что с метками, чем обосновано переключение и
  # что именно ему мешает. Ничего не пишет и ничего не разрешает: переключает `assignment-mode`.
  #
  # Прикладного env не требует вовсе — в базу ходит только `DATABASE_MAINTENANCE_URL` (З3, П7).
  # Коды возврата: 0 — готов, 3 — есть препятствия (перечислены), поэтому команда годится и как
  # шаг job'а выката: `run --rm assignment-report --json && …`.
  #
  #   docker compose -p technic --profile tools run --rm assignment-report
  #   docker compose -p technic --profile tools run --rm assignment-report --data --json
  assignment-report:
    image: technic-api:${TAG:-latest}
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
      - ${MAINTENANCE_ENV_FILE:-${ENV_FILE:-/etc/technic-portal/prod.env}}
    environment:
      NODE_ENV: production
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
    entrypoint: ['pnpm', '--filter', '@technic/api', 'assignment:report']
    command: []
    restart: 'no'
    profiles: [tools]
    networks: [internal]

  # pg_dump/pg_restore для deploy-auto (бэкап БД перед миграциями, restore).
  # Запускается ТОЛЬКО через `run --rm` (deploy-auto подставляет команду); default-команда
  # безобидна, чтобы `up` с профилем tools ничего не поднимал вечно. postgres:17 = мажор
  # сервера Yandex Managed PG. От UID/GID владельца — дампы ложатся в db-backups (700, root
  # не нужен). $DATABASE_MIGRATION_URL раскрывается ВНУТРИ контейнера — секрета в argv нет.
  db-tools:
    image: postgres:17
    env_file:
      - ${ENV_FILE:-/etc/technic-portal/prod.env}
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/technic-portal/certs/yandex-root.crt
    user: '${AUTO_DEPLOY_UID:-0}:${AUTO_DEPLOY_GID:-0}'
    volumes:
      - /etc/technic-portal/certs:/etc/technic-portal/certs:ro
      - ${AUTO_BACKUP_DIR:-/var/lib/technic/deploy/db-backups}:/backups
    command: ['true']
    restart: 'no'
    profiles: [tools]
    networks: [internal]

networks:
  internal:
    driver: bridge
  edge:
    external: true
