# nginx внутри контейнера web: статика SPA + прокси /api на api-контейнер.
# TLS и строгие security-заголовки — на infra-nginx (см. deploy/nginx/technic.conf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;         # файлы грузятся напрямую в S3, не через API

  # Заголовки прокси — на уровне server, а не внутри `location /api/` (ADR 0148). Печать живёт в
  # своей локации из-за срока, а nginx НЕ наследует `proxy_set_header` между локациями: достаточно
  # одного такого заголовка внутри location, чтобы весь набор с внешнего уровня был отброшен
  # целиком. Продублировать их во второй локации значило бы завести вторую копию правил про
  # X-Forwarded-For — и однажды поправить только одну.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Отдаём заголовок от edge-nginx как есть, себя не дописываем ($proxy_add_x_forwarded_for):
  # адрес этого контейнера API не нужен, а лишний адрес в цепочке сдвинул бы отсчёт хопов.
  # В итоге до API доходит ровно один адрес — клиентский, — а API доверяет ровно одному хопу
  # (TRUST_PROXY=1), и req.ip совпадает с настоящим адресом клиента.
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  # Не перезаписывать proto от edge-nginx (иначе secure-cookie ломаются)
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # Обычная ручка портала отвечает за миллисекунды, и ждать её минуту уже незачем: висящий запрос
  # здесь означает поломку, а не работу.
  proxy_read_timeout 60s;

  # Печать путевого листа — единственный путь, где долгое ожидание нормально (ADR 0148): сервер
  # переводит бланки в PDF внешним конвертером. Срок берётся из общей лестницы `PRINT_BUDGET`
  # (`packages/contracts/src/print-budget.ts`) и обязан быть БОЛЬШЕ серверного: оборвав раньше,
  # nginx лишает человека осмысленного ответа — ровно этим дефект и был.
  # Равенство числа лестнице стережёт `apps/api/test/print-budget.test.ts`.
  # Своих `proxy_set_header` тут нет намеренно — см. выше.
  # Выражение В КАВЫЧКАХ: без них nginx принимает `{36}` за начало блока и не поднимается вовсе.
  location ~ "^/api/v1/waybills/(print-batch|[0-9a-fA-F-]{36}/print)$" {
    proxy_pass http://technic-api:3000;
    proxy_read_timeout 165s;
  }

  # Важно: имя контейнера/сервиса, не короткое `api` —
  # на сети edge алиас `api` есть и у zakupki-api → round-robin 404.
  location /api/ {
    proxy_pass http://technic-api:3000;
  }

  # Внутренние маршруты API (`/internal/*`, ADR 0075) наружу не выходят: ими планировщик из worker
  # просит API собрать рассылку, и доступ к ним закрыт общим секретом. Явный отказ, а не молчаливое
  # «сюда и так не проксируется»: правило `location /api/` однажды расширят, и лишний путь уедет
  # наружу вместе с ним.
  location /internal/ { return 404; }

  # Метка версии: всегда свежая (клиент уже шлёт no-store; подстраховка на уровне прокси).
  # add_header внутри location отменяет наследование server-level заголовков — дублируем их.
  location = /version.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # ─── Режим технических работ (docs/maintenance-mode-plan.md §4.4) ───────────────────────────
  # Статус режима — файл на хосте, смонтированный каталогом в /etc/nginx/maintenance
  # (deploy/docker-compose.yml). Он единственный источник, который переживает остановку
  # technic-api в окне выката, поэтому и отдаётся вебом, а не API.
  #
  # Путь задан `alias`, а не `root`: файл лежит ВНЕ корня (/usr/share/nginx/html), и `root`
  # приписал бы URI к своему значению — nginx искал бы
  # /etc/nginx/maintenance/maintenance.json/maintenance.json и не находил бы никогда, то есть
  # режим не включался бы вовсе. Вне корня файл лежит тоже намеренно: внутри его подобрал бы
  # try_files и раздавал как часть SPA.
  #
  # Файла нет → 404, и это штатный ответ «режима нет»: клиент снимает заглушку только по 404 или
  # по `active:false`. Отсюда требование к правам на хосте (см. комментарий у маунта в compose):
  # каталог обязан быть проходим, а файл читаем для uid 101 — под ним работают воркеры nginx
  # внутри контейнера. При отказе в доступе ответ станет 403, а 403 заглушку уже не снимет.
  # Секрета в файле нет по определению: портал публикует его содержимое этой самой локацией.
  #
  # add_header внутри location отменяет наследование с уровня server — заголовки продублированы
  # по той же причине, что у /version.json выше.
  location = /maintenance.json {
    alias /etc/nginx/maintenance/maintenance.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Статическая заглушка на навигацию (§3 плана, «Граница и дешёвое усиление»). Лежит в корне
  # образа рядом с бандлом (deploy/Dockerfile.web) и НЕ в /etc/nginx/maintenance: bind-mount
  # каталога с хоста скрывает всё, что образ положил внутрь этого каталога, — заглушка исчезла бы
  # ровно в том окне, ради которого заводится.
  #
  # Локация точная (`=`) по двум причинам сразу: внутренний редирект `error_page 503` обязан
  # попасть сюда, а не обратно в `location /`, где `if` ниже вернул бы 503 повторно — а повторную
  # обработку error_page nginx по умолчанию не делает (recursive_error_pages off), и человек
  # получил бы служебную страницу «503 Service Temporarily Unavailable» вместо объявления
  # (проверено на nginx:1.27-alpine); и точное совпадение разбирается раньше catch-all'а всегда,
  # независимо от порядка блоков в файле.
  #
  # `internal` тут нет намеренно: пробы выката проверяют одним curl, что заглушка вообще есть в
  # образе, и делают это ДО включения режима — с `internal` такая проверка отвечала бы 404 и
  # ничего не доказывала.
  location = /maintenance.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # index.html всегда ревалидируется, чтобы reload после деплоя тянул свежие хеши ассетов.
  # SPA-fallback (try_files ... /index.html) внутренне попадает сюда и тоже получает no-cache.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Хешированные ассеты Vite — иммутабельны, кешируем надолго (ускоряет повторные загрузки).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Навигация SPA и всё, что не подошло локациям выше. Здесь же — единственная проверка режима
  # техработ: пока флаг-файл на месте, любая перезагрузка страницы показывает объявление, а не
  # оболочку приложения, — независимо от возраста сборки вкладки и от того, жив ли technic-api
  # (§3 плана: гейт в API в окне `--cutover` молчит, потому что контейнер остановлен).
  # `if` внутри location — тот самый безопасный случай: в теле только `return`.
  #
  # Почему проверка стоит именно здесь и ничего не ломает. nginx разбирает точные локации и более
  # длинные префиксы раньше catch-all'а, поэтому под 503 НЕ попадают:
  #   · /maintenance.json — иначе клиент не смог бы узнать, что режим снят, и заглушка не ушла бы;
  #   · /maintenance.html — иначе внутренний редирект error_page вернулся бы сюда, получил 503
  #     снова, и вместо объявления человек увидел бы служебную страницу nginx;
  #   · /version.json и /assets/ — хешированная статика продолжает раздаваться, и вкладке после
  #     снятия режима нечего дозагружать;
  #   · /api/ и локация печати — гейт режима живёт в API и отвечает своим 503 с телом, которое
  #     разбирает клиент. Проксированных ответов error_page не касается вовсе:
  #     proxy_intercept_errors по умолчанию off, и включать его здесь нельзя — подменённое телом
  #     заглушки 503 `maintenance_mode` лишило бы вкладку причины и срока.
  # Цена усиления — корневые файлы вроде /favicon.ico в окне тоже отвечают 503. Это ровно то,
  # чего мы хотим: в окне портал закрыт целиком.
  #
  # Точная локация /index.html под проверку не заведена сознательно: SPA-fallback до неё в окне не
  # доходит (return 503 срабатывает раньше try_files), а прямой запрос /index.html портал не
  # порождает — там человека встретит новый клиент со своей заглушкой.
  location / {
    if (-f /etc/nginx/maintenance/maintenance.json) { return 503; }
    error_page 503 /maintenance.html;
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
