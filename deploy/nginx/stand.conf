# Стенд приёмки — внешний nginx локального prod-подобного контура (docs/smart-captcha-plan.md §11).
# Поднимается только через deploy/docker-compose.stand.yml; в деплое НЕ участвует. На VPS едет один
# файл — deploy/nginx/technic.conf (sync_vhost в deploy-auto.sh синхронизирует ровно его), а этот
# конфиг живёт на машине разработчика и в /opt/infra/nginx/conf.d/ не кладётся никогда.
#
# Зачем он нужен. Две приёмки нельзя провести ни на локальном Vite (production-CSP там нет вовсе),
# ни на deploy/docker-compose.dev.yml (там только PostgreSQL и MinIO):
#   * CSP — политику отдаёт внешний nginx, и увидеть, что сторонний скрипт капчи не режется, можно
#     только под настоящей политикой и на собранном production-бандле;
#   * неподменяемость X-Forwarded-For (§6) — доказывается только через ОБА nginx. Unit на
#     parseTrustProxy и любой тест через app.inject защиту не показывают: при trustProxy=1
#     подставленный клиентом заголовок как раз и станет req.ip.
# Поэтому цепочка воспроизводится целиком: этот файл играет роль внешнего infra-nginx
# (deploy/nginx/technic.conf), а внутри контейнера веба остаётся штатный deploy/nginx/spa.conf.
#
# Строка Content-Security-Policy ниже — ПОСИМВОЛЬНАЯ копия боевой из technic.conf. Вынести её в
# общий include нельзя (§11: sync_vhost раскатывает один файл и при неудаче лишь предупреждает —
# правка фрагмента осталась бы в репозитории при внешне успешном деплое). Поэтому копий две, а
# равенство держит тест apps/api/test/deploy-config.test.ts: правят CSP всегда в обоих файлах
# сразу, расхождение ловится прогоном, а не глазами.
#
# Порт 8080 и HTTP без TLS — сознательно: стенд локальный, домен localhost есть в списке сайтов
# dev-капчи (§8), а нестандартный порт приезжает в поле host ответа /validate, поэтому сверка идёт
# по URL.host и PUBLIC_ORIGIN стенда задан с портом (deploy/docker-compose.stand.yml).

server {
    listen 8080;
    server_name localhost;

    # Strict-Transport-Security боевого vhost здесь намеренно нет: по HTTP браузер обязан такой
    # заголовок игнорировать, а если бы не игнорировал — пин на localhost сломал бы все остальные
    # локальные приложения этого хоста. На приёмку CSP и XFF он не влияет.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Зачем в политике s3.cloud.ru, blob: и остальное — объяснено в technic.conf над той же
    # строкой; здесь копия ровно одной директивы, чтобы сверка теста была посимвольной.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://s3.cloud.ru https://*.s3.cloud.ru https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru; frame-src 'self' blob: https://s3.cloud.ru https://*.s3.cloud.ru https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru; connect-src 'self' https://s3.cloud.ru https://*.s3.cloud.ru https://suggestions.dadata.ru https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru" always;

    client_max_body_size 2m;

    # Как в бою: имя контейнера резолвится Docker DNS в момент запроса, а не на старте, — nginx
    # поднимается, даже если веб ещё собирается.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $web technic-web;

    location / {
        proxy_pass http://$web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Заголовок ПЕРЕЗАПИСЫВАЕТСЯ адресом соединения, а не дополняется
        # ($proxy_add_x_forwarded_for) — ровно как в technic.conf. Этот nginx единственный видит
        # настоящего клиента, поэтому всё, что клиент прислал в X-Forwarded-For сам, — вымысел.
        # На этом и стоит приёмка §6: восемь запросов к /api/v1/auth/register, каждый со своим
        # X-Forwarded-For (10.0.0.1…10.0.0.8), обязаны считаться одним источником, и с шестого
        # приходит 429; в логе api remoteAddress (это req.ip Fastify) — настоящий адрес клиента.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
