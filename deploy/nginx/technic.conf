# technic / auto — auto.su10.ru (primary). nip.io redirects here.
# Кладётся в /opt/infra/nginx/conf.d/technic.conf, затем:
#   docker exec infra-nginx nginx -t && docker exec infra-nginx nginx -s reload
# Динамический резолвинг имён контейнеров (Docker DNS).
# Не трогать соседние vhost в conf.d (zakupki, estimat, billhub, keycloak).

server {
    listen 80;
    server_name auto.su10.ru auto.89-232-188-170.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://auto.su10.ru$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auto.89-232-188-170.nip.io;

    ssl_certificate     /etc/letsencrypt/live/auto.89-232-188-170.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto.89-232-188-170.nip.io/privkey.pem;

    return 301 https://auto.su10.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auto.su10.ru;

    ssl_certificate     /etc/letsencrypt/live/auto.su10.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto.su10.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Вложения показываются окном просмотра прямо в портале (картинка <img>, PDF/текст <iframe>),
    # а ссылка на объект ведёт на хранилище — поэтому s3.cloud.ru нужен в img-src и frame-src.
    # Без этого окно просмотра остаётся пустым: default-src 'self' режет и картинку, и фрейм.
    # blob: в frame-src — для печати путевого листа (ADR 0041): бланк приходит телом ответа и
    # показывается фреймом из памяти вкладки. Под 'self' такой адрес не подпадает — у blob:
    # собственный источник, и без явной схемы браузер режет фрейм, оставляя окно печати пустым.
    # Домены SmartCaptcha (ADR 0130): виджет грузит скрипт со smartcaptcha.cloud.yandex.ru, рисует
    # задание во фрейме и ходит за ним же на captcha-api.yandex.ru — поэтому оба стоят сразу в
    # четырёх директивах. Точный список Яндекс не публикует; он снят по консоли браузера на стенде
    # (deploy/nginx/stand.conf), а не угадан. Стенд держит ПОСИМВОЛЬНО ту же строку — равенство
    # стережёт apps/api/test/deploy-config.test.ts: общего include у них нет, потому что деплой
    # раскатывает только этот файл (docs/smart-captcha-plan.md §11).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://s3.cloud.ru https://*.s3.cloud.ru https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru; frame-src 'self' blob: https://s3.cloud.ru https://*.s3.cloud.ru https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru; connect-src 'self' https://s3.cloud.ru https://*.s3.cloud.ru https://suggestions.dadata.ru https://smartcaptcha.cloud.yandex.ru https://captcha-api.yandex.ru" always;

    client_max_body_size 2m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $web technic-web;

    location / {
        proxy_pass http://$web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Заголовок перезаписывается, а не дополняется ($proxy_add_x_forwarded_for): этот nginx —
        # единственный, кто видит настоящего клиента, поэтому всё, что клиент прислал в
        # X-Forwarded-For сам, — вымысел, и дописывать к нему свой адрес значит этот вымысел
        # узаконить. Иначе кто угодно подставляет себе любой адрес и обходит IP-лимиты портала.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
