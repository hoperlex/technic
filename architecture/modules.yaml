# Карта модулей уровня монорепозитория.
#
# ЗАЧЕМ ОНА, ЕСЛИ ЕСТЬ КАРТА КОДА. Карта кода (`docs/code-map.md`) отвечает на вопрос «куда идти с
# таким изменением» и режет портал по доменам — вывоз мусора, заказ ТС, оргтехника. Этот файл
# отвечает на другой вопрос: «что чему разрешено знать». Домены здесь не перечисляются вовсе:
# их состав система читает разбором карты кода, и второй список разошёлся бы с первым в первую же
# неделю.
version: 1

# Реестр доменов — внешний. `idField` — как домен назван в карте: строка «- Домен: `оргтехника`».
domains:
  source: docs/code-map.md
  dictionary: scripts/lib/docs-navigation.mjs # словарь DOMAINS, общий с указателем решений

# Пакеты монорепозитория и разрешённые направления между ними.
#
# Направления здесь, а не в линте, по простой причине: линт этого не проверяет. Правила границ в
# `eslint.config.mjs` живут внутри `apps/web/src` (слои FSD), а уровнем выше не стережёт ничто —
# импорт из `apps/api` в `apps/web` прошёл бы молча. Проверка направлений — работа анализатора
# зависимостей (этап ЭB плана), здесь только сама договорённость.
packages:
  - id: contracts
    path: packages/contracts
    role: shared-language
    publicApi: packages/contracts/src/index.ts
    # Общий язык сервера и портала: статусы, права, предикаты, словари. Знает только себя —
    # зависимость контрактов от приложения означала бы, что словарь зависит от одного из
    # говорящих на нём.
    mayDependOn: []

  - id: api
    path: apps/api
    role: backend
    mayDependOn: [contracts]

  - id: worker
    path: apps/worker
    role: backend
    mayDependOn: [contracts]

  - id: web
    path: apps/web
    role: frontend
    mayDependOn: [contracts]

  - id: tools
    path: tools/maintenance
    role: tooling
    # Ядро обслуживания не знает приложения: всё project-specific приходит конфигом. Это же
    # условие делает возможным вынос ядра во внешнюю библиотеку (см. `project/` — единственный
    # каталог, которому знать репозиторий разрешено).
    mayDependOn: []

  - id: scripts
    path: scripts
    role: tooling
    mayDependOn: []

# Слои внутри портала описаны один раз — в конфиге линта, и он же их исполняет. Здесь только
# указатель на носителя: системе нужно знать, что правило есть и кто за него отвечает.
layers:
  - id: web-fsd
    scope: apps/web/src
    enforcedBy: eslint
    source: eslint.config.mjs
    order: [shared, entities, features, widgets, pages, app]
    entry: index.ts
    notes: >
      Слой видит только то, что ниже него, и только через `index.ts` слайса. Сегменты `shared`
      имеют собственную матрицу направлений. Разложен не весь `src/`: на нераспределённых файлах
      правило молчит (этап 7 плана FSD).

# Общие области: их правка задевает всех, поэтому цена ошибки выше, а порог уверенности — тоже.
shared:
  - packages/contracts/src
  - apps/web/src/shared
  - apps/api/src/db
  - scripts/lib
