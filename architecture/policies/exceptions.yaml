# Осознанные исключения из архитектурных правил.
#
# Реестр намеренно пуст. Это не заготовка «на будущее»: исключения, которые уже действуют, имеют
# своих носителей и здесь НЕ дублируются — разрешение видам заявок брать общее из `entities/request`
# выдано политикой линта, вывод фикстур из-под проверки — списком `ignores` там же, две занятые
# дважды нумерации решений — точными множествами имён в `scripts/lib/docs-navigation.mjs`. Копия
# любого из них в этом файле разошлась бы с оригиналом при первой правке.
#
# Сюда попадает исключение, у которого носителя нет: место, где правило нарушено сознательно и
# машина об этом знать не может. Форма записи:
#
#   - id: <короткий идентификатор>
#     policy: <id правила из architecture.yaml>
#     paths: ['<путь или маска>']
#     reason: >
#       Почему нарушение оправдано и что сломается, если «починить».
#     approvedBy: <кто согласовал>
#     since: YYYY-MM-DD
#     reviewBy: YYYY-MM-DD        # дата пересмотра; просроченная — повод для находки, а не тишина
#
# Исключение без причины и без даты пересмотра — это не исключение, а забытое нарушение.
version: 1
exceptions: []
