# Политика нумерации версий портала: из чего состоит номер, когда какая часть растёт и чем
# помечен выпуск.
#
# ЗАЧЕМ МАШИНОЧИТАЕМО. Правила версии до сих пор жили пересказом внутри решения о журнале
# обновлений, и проверить их было нечем: номер сходился ровно настолько, насколько внимателен был
# человек, писавший миграцию выпуска. Здесь лежат ПРАВИЛА, а обоснование — в
# `docs/adr/0191-version-numbering.md`; расходиться им нельзя, и связь названа полем `adr`.
#
# ЧЕМ ЭТО НУЖНО СИСТЕМЕ ОБСЛУЖИВАНИЯ. Цикл сходимости стартует со стабильной точки и обязан уметь
# сказать, от какой именно: без якоря «зелёное дерево» — это любое место истории, и откатываться
# после неудачной партии некуда. Якорь даёт выпуск: версия в `VERSION`, тег на коммите и запись в
# журнале. Поэтому политика версий — предусловие релизного режима, а не оформление.
version: 1
adr: docs/adr/0191-version-numbering.md

format:
  # `<линия>.<выпуск в линии>.<последнее решение выпуска>`; пример — 0.1.82.0190.
  pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.([0-9]{4})$'
  parts:
    - id: major
      meaning: >
        Ноль — портал ведётся как развивающаяся система; единица — промышленная эксплуатация.
        Условия перехода перечислены ниже в `firstMajor`, и других оснований поднять его нет.
    - id: minor
      meaning: >
        Линия. Растёт на этапе или несущем куске портала — том, после которого прежние
        договорённости перестают описывать систему (пример из решения о журнале: переезд
        аутентификации). Счёт выпусков при смене линии начинается заново, порядок записей
        журнала — нет.
    - id: release
      meaning: >
        Номер выпуска внутри линии. Растёт на каждом выкате наружу и никогда не переиспользуется.
        Это НЕ `seq` журнала: `seq` сквозной по таблице и при смене линии продолжается, а здесь
        счёт начинается заново.
    - id: decision
      meaning: >
        Номер последнего решения, вошедшего в выпуск, четырьмя цифрами. По нему версия
        сопоставима с репозиторием: на вопрос «это уже с новыми бланками?» отвечает сам номер.
      rules:
        # Выпуск без собственного решения законен — так было у 0.1.78.0178 и 0.1.79.0178.
        - id: decision-repeats-when-no-new-adr
          text: >
            Если выпуск не принёс нового решения, хвост повторяет хвост предыдущего выпуска.
        - id: decision-monotonic
          text: >
            Порядок выпусков назначается по последнему решению блока, поэтому хвост монотонен по
            построению: 0.1.4.0071 не встаёт после 0.1.5.0069.

sources:
  # Единственный источник в репозитории. Манифесты пакетов версию НЕ несут: их четыре, синхронного
  # смысла у них нет, и `0.1.0` там — техническая заглушка рабочего пространства pnpm.
  file: VERSION
  # The release tag (amended 25.09.2026, ADR 0191 §6). It marks the commit that BROUGHT the release
  # migration, because that commit is unambiguous and checkable from history alone; "the deployed
  # commit" was neither — deploys go in batches, and nothing in the repository records them. So the
  # tag means "the release is built", not "the release is deployed": what runs in production is
  # answered by `deploy-auto --status`. The maintenance system needs the tag as its start and
  # rollback point, and a built release is exactly that.
  tag:
    pattern: 'v{version}'
    # Annotated only: a lightweight tag carries no author, date or message, so nobody can tell
    # afterwards who placed it and on what grounds.
    kind: annotated
    # The oldest commit that added the migration inserting this release into `app_releases`
    # (`git log --diff-filter=A -- <migration> | tail -1`).
    target: release-migration-commit
    since: '0.1.83.0191'
    # Releases before `since` stay untagged: 82 of them were deployed without tags, and for some
    # the release commit cannot be determined reliably. A tag restored by guess is worse than none —
    # it looks like a fact. The releases 0.1.83.0192…0.1.99.0208 are NOT such a guess: they are at
    # or above the threshold, and their tags were restored on 25.09.2026 by the migration commit,
    # which is unambiguous.
    retroactive: false
    # Tags are pushed so that every clone sees the same start points; a local-only tag is
    # a warning under `--remote`, a tag that differs from origin is an error.
    push: origin
    # The person who pushes the release commit to origin/main places and pushes the tag right after
    # that push. Not the deploy: a batch deploy spans several releases, and the tag does not depend on
    # it — each release keeps its own tag on its own migration commit.
    placedBy: pusher-of-release-commit
  journal:
    table: app_releases
    written_by: migration
    # Запись выпуска заводит миграция (решение о журнале обновлений). Версия в ней и в `VERSION`
    # обязаны совпадать — это и проверяет `pnpm check:version`.

# ИЗВЕСТНЫЕ КОЛЛИЗИИ — точными множествами версий, а не разрешёнными номерами.
#
# Номер выпуска в линии ведётся руками, и дважды его занимала параллельная работа: сессия брала
# следующий номер, не зная, что соседняя уже взяла его же. Перенумеровать поздно — версии уехали в
# журнал на проде и в сообщения коммитов. Поэтому прошлое названо поимённо, а множество сверяется
# целиком: третья версия с тем же номером проехала бы молча, разреши мы «номер 64 занимать дважды».
knownCollisions:
  - release: 64
    versions: ['0.1.64.0154', '0.1.64.0155']
    reason: >
      Выкат автозапчастей (выпуск 73) и подтверждение талона одной кнопкой (выпуск 74) шли
      параллельно; см. шапку `apps/api/drizzle/0248_releases_auto_parts_freeze.sql`.
  - release: 66
    versions: ['0.1.66.0156', '0.1.66.0158']
    reason: >
      Справочник моделей механизации (выпуск 76) и цветность печати оргтехники (выпуск 77) заняли
      один номер тем же порядком.

# KNOWN SHARED RELEASE COMMITS — several releases brought by one commit, as exact sets of versions.
#
# Legal: such a commit gets one tag per release, and VERSION in it shows the eldest of them. Named
# one by one for the same reason as the collisions above: were "two tags on one commit" allowed in
# general, a tag placed on the wrong commit would pass as one more such case. A new case is a
# warning of `pnpm check:version`; `commit` is checked too, so a stale entry does not linger.
knownSharedReleaseCommits:
  - commit: 'f7246a0f'
    versions: ['0.1.87.0197', '0.1.89.0199']
    reason: >
      «Аппараты сообщают о себе письмами» (0.1.87.0197) и журнал отправки писем (0.1.89.0199)
      приехали одним коммитом; 0.1.88.0197 из b5421fb9 — его предок, то есть выпуск 87 появился в
      истории позже выпуска 88. VERSION в коммите — 0.1.89.0199.
  - commit: '6b3c3330'
    versions: ['0.1.92.0202', '0.1.93.0203']
    reason: >
      Артикул в строке чека (0.1.92.0202) и распознавание скана чека (0.1.93.0203) приехали одним
      коммитом. VERSION в коммите — 0.1.93.0203.

consistency:
  check: scripts/check-version.mjs
  command: pnpm check:version
  rules:
    - id: file-matches-journal
      severity: error
      text: >
        Версия в `VERSION` совпадает с версией последней записи выпуска в миграциях.
    - id: release-grows
      severity: error
      text: >
        Номер выпуска в линии строго больше предыдущего, а линия не убывает.
    - id: decision-exists
      severity: error
      text: >
        Решение из хвоста версии существует в `docs/adr` — либо повторяет хвост предыдущего
        выпуска.
    # Tag rules. `mode` names the flag that turns a rule on: the default run stays cheap and
    # offline, the audit reads the whole history, and only `--remote` touches the network.
    - id: tag-present
      severity: warning
      mode: default
      text: >
        У каждого выпуска начиная с `tag.since` есть тег `v<версия>` — у всех, а не только у
        текущего. Предупреждение, а не ошибка: тег ставится после пуша коммита выпуска, а проверка
        запускается и до него.
    - id: release-commit-shared
      severity: warning
      mode: default
      text: >
        Несколько выпусков, привезённых одним коммитом, перечислены в `knownSharedReleaseCommits`
        точным множеством; новый такой случай — предупреждение, устаревшая запись — тоже.
    - id: tag-annotated
      severity: error
      mode: --tags
      text: >
        Тег выпуска аннотированный (`git tag -a`), а не лёгкий.
    - id: tag-on-release-migration-commit
      severity: error
      mode: --tags
      text: >
        Тег `v<версия>` указывает (`^{commit}`) ровно на коммит, который добавил миграцию с
        записью этого выпуска в `app_releases`. Тег без такой записи — тоже ошибка.
    - id: tag-commit-version
      severity: warning
      mode: --tags
      text: >
        В помеченном коммите `VERSION` показывает старший из выпусков, которые этот коммит привёз.
    - id: tag-pushed
      severity: warning
      mode: --remote
      text: >
        Тег выпуска запушен в origin; тег, который есть в origin, но не локально, — тоже
        предупреждение.
    - id: tag-matches-origin
      severity: error
      mode: --remote
      text: >
        Тег в origin указывает на тот же коммит, что и локальный: иначе две машины называют одним
        выпуском разные коммиты.

firstMajor:
  # Условия перехода на 1.0. Дата не назначается: major поднимается тогда, когда все условия
  # выполнены, и это проверяемо, а не объявляется решением задним числом.
  conditions:
    - id: gates-green-each-release
      text: >
        Ворота качества (`pnpm check` и `pnpm check:db`) зелёные на выкате, а не «обычно зелёные».
    - id: no-dual-read-modes
      text: >
        Ни один модуль не живёт в двух режимах чтения одновременно. Сегодня это нарушено:
        история назначения читается через `read_mode`, и обе ветви поддерживаются в каждой правке
        (`docs/assignment-periods-plan.md`, §10).
    - id: no-pending-schema-debt
      text: >
        Нет обещанных и ненаписанных ужесточений схемы. Пример долга: `NOT NULL` на
        `ordered_vehicle_type_id`, обещанный планом «техника крупнее заказанной» и не написанный.
    - id: version-anchored
      text: >
        Версия согласована в трёх местах — `VERSION`, тег выпуска, запись журнала, — и это
        подтверждает `pnpm check:version -- --tags --remote` без ошибок.
    - id: release-convergence-runs
      text: >
        Релизный цикл системы обслуживания отработал на выпуске целиком: партии приняты или
        откачены, остаток ушёл в backlog (`docs/maintenance-framework-plan.md`).
