# Политика нумерации версий портала: из чего состоит номер, когда какая часть растёт и чем
# помечен выпуск.
#
# ЗАЧЕМ МАШИНОЧИТАЕМО. Правила версии до сих пор жили пересказом внутри решения о журнале
# обновлений, и проверить их было нечем: номер сходился ровно настолько, насколько внимателен был
# человек, писавший миграцию выпуска. Здесь лежат ПРАВИЛА, а обоснование — в
# `docs/adr/0191-version-numbering.md`; расходиться им нельзя, и связь названа полем `adr`.
#
# ЧЕМ ЭТО НУЖНО СИСТЕМЕ ОБСЛУЖИВАНИЯ. Цикл сходимости стартует со стабильной точки и обязан уметь
# сказать, от какой именно: без якоря «зелёное дерево» — это любое место истории, и откатываться
# после неудачной партии некуда. Якорь даёт выпуск: версия в `VERSION`, тег на коммите и запись в
# журнале. Поэтому политика версий — предусловие релизного режима, а не оформление.
version: 1
adr: docs/adr/0191-version-numbering.md

format:
  # `<линия>.<выпуск в линии>.<последнее решение выпуска>`; пример — 0.1.82.0190.
  pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.([0-9]{4})$'
  parts:
    - id: major
      meaning: >
        Ноль — портал ведётся как развивающаяся система; единица — промышленная эксплуатация.
        Условия перехода перечислены ниже в `firstMajor`, и других оснований поднять его нет.
    - id: minor
      meaning: >
        Линия. Растёт на этапе или несущем куске портала — том, после которого прежние
        договорённости перестают описывать систему (пример из решения о журнале: переезд
        аутентификации). Счёт выпусков при смене линии начинается заново, порядок записей
        журнала — нет.
    - id: release
      meaning: >
        Номер выпуска внутри линии. Растёт на каждом выкате наружу и никогда не переиспользуется.
        Это НЕ `seq` журнала: `seq` сквозной по таблице и при смене линии продолжается, а здесь
        счёт начинается заново.
    - id: decision
      meaning: >
        Номер последнего решения, вошедшего в выпуск, четырьмя цифрами. По нему версия
        сопоставима с репозиторием: на вопрос «это уже с новыми бланками?» отвечает сам номер.
      rules:
        # Выпуск без собственного решения законен — так было у 0.1.78.0178 и 0.1.79.0178.
        - id: decision-repeats-when-no-new-adr
          text: >
            Если выпуск не принёс нового решения, хвост повторяет хвост предыдущего выпуска.
        - id: decision-monotonic
          text: >
            Порядок выпусков назначается по последнему решению блока, поэтому хвост монотонен по
            построению: 0.1.4.0071 не встаёт после 0.1.5.0069.

sources:
  # Единственный источник в репозитории. Манифесты пакетов версию НЕ несут: их четыре, синхронного
  # смысла у них нет, и `0.1.0` там — техническая заглушка рабочего пространства pnpm.
  file: VERSION
  # Тег на коммите, который выкачен. Нужен системе обслуживания как точка старта и отката.
  tag:
    pattern: 'v{version}'
    since: '0.1.83.0191'
    retroactive: false
    # Задним числом теги не расставляются: 82 прежних выпуска выкатывались без них, и коммит
    # выпуска у части из них достоверно не определить. Восстановленный наугад тег хуже
    # отсутствующего — он выглядит как факт.
  journal:
    table: app_releases
    written_by: migration
    # Запись выпуска заводит миграция (решение о журнале обновлений). Версия в ней и в `VERSION`
    # обязаны совпадать — это и проверяет `pnpm check:version`.

# ИЗВЕСТНЫЕ КОЛЛИЗИИ — точными множествами версий, а не разрешёнными номерами.
#
# Номер выпуска в линии ведётся руками, и дважды его занимала параллельная работа: сессия брала
# следующий номер, не зная, что соседняя уже взяла его же. Перенумеровать поздно — версии уехали в
# журнал на проде и в сообщения коммитов. Поэтому прошлое названо поимённо, а множество сверяется
# целиком: третья версия с тем же номером проехала бы молча, разреши мы «номер 64 занимать дважды».
knownCollisions:
  - release: 64
    versions: ['0.1.64.0154', '0.1.64.0155']
    reason: >
      Выкат автозапчастей (выпуск 73) и подтверждение талона одной кнопкой (выпуск 74) шли
      параллельно; см. шапку `apps/api/drizzle/0248_releases_auto_parts_freeze.sql`.
  - release: 66
    versions: ['0.1.66.0156', '0.1.66.0158']
    reason: >
      Справочник моделей механизации (выпуск 76) и цветность печати оргтехники (выпуск 77) заняли
      один номер тем же порядком.

consistency:
  check: scripts/check-version.mjs
  command: pnpm check:version
  rules:
    - id: file-matches-journal
      severity: error
      text: >
        Версия в `VERSION` совпадает с версией последней записи выпуска в миграциях.
    - id: release-grows
      severity: error
      text: >
        Номер выпуска в линии строго больше предыдущего, а линия не убывает.
    - id: decision-exists
      severity: error
      text: >
        Решение из хвоста версии существует в `docs/adr` — либо повторяет хвост предыдущего
        выпуска.
    - id: tag-present
      severity: warning
      text: >
        У выпуска начиная с `tag.since` есть тег `v<версия>`. Предупреждение, а не ошибка: тег
        ставится в момент выката, а проверка запускается и до него.

firstMajor:
  # Условия перехода на 1.0. Дата не назначается: major поднимается тогда, когда все условия
  # выполнены, и это проверяемо, а не объявляется решением задним числом.
  conditions:
    - id: gates-green-each-release
      text: >
        Ворота качества (`pnpm check` и `pnpm check:db`) зелёные на выкате, а не «обычно зелёные».
    - id: no-dual-read-modes
      text: >
        Ни один модуль не живёт в двух режимах чтения одновременно. Сегодня это нарушено:
        история назначения читается через `read_mode`, и обе ветви поддерживаются в каждой правке
        (`docs/assignment-periods-plan.md`, §10).
    - id: no-pending-schema-debt
      text: >
        Нет обещанных и ненаписанных ужесточений схемы. Пример долга: `NOT NULL` на
        `ordered_vehicle_type_id`, обещанный планом «техника крупнее заказанной» и не написанный.
    - id: version-anchored
      text: >
        Версия согласована в трёх местах — `VERSION`, тег выпуска, запись журнала, — и это
        подтверждает `pnpm check:version`.
    - id: release-convergence-runs
      text: >
        Релизный цикл системы обслуживания отработал на выпуске целиком: партии приняты или
        откачены, остаток ушёл в backlog (`docs/maintenance-framework-plan.md`).
